[project]
name = "thirtyagent"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
thirtyagent = "minicode.cli:app"
minicode = "minicode.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minicode"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: typer.Option/Argument in defaults is the framework's required idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]
